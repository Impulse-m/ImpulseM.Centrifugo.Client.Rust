[package]
name = "centrifuge-fake-server"
description = "In-process fake Centrifugo for centrifuge-client tests and the validation harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
centrifuge-core = { workspace = true, features = ["json"] }
bytes = "1.12"
futures-util = { version = "0.3.31", default-features = false, features = ["std", "sink"] }
http-body-util = "0.1.3"
hyper = { version = "1.9", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
prost = { version = "0.14.4", default-features = false, features = ["std"] }
serde_json = "1.0.140"
tokio = { version = "1.47", features = ["rt", "sync", "time", "net", "macros", "io-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[lints]
workspace = true
