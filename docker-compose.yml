# Test servers for the integration and real-server chaos tests (docs/spec.md §11.4).
# Same shape as centrifuge-js: an insecure instance for most scenarios and a
# secure one for token expiry and refresh. Pinned so findings name the server.
# Host ports 8010/8012 so this stack runs alongside other SDKs' stacks (8000/8002).
services:
  centrifugo:
    image: centrifugo/centrifugo:v6.10.2
    command:
      - centrifugo
      - --config=/centrifugo/config.json
    ports:
      - "8010:8000"
    volumes:
      - ./tests/centrifugo/centrifugo_test.json:/centrifugo/config.json:ro

  # Connection tokens required, subscription tokens required in `private`,
  # short expired close delays: token expiry and refresh scenarios.
  centrifugo_secure:
    image: centrifugo/centrifugo:v6.10.2
    command:
      - centrifugo
      - --config=/centrifugo/config.json
    ports:
      - "8012:8000"
    volumes:
      - ./tests/centrifugo/centrifugo_secure_test.json:/centrifugo/config.json:ro
