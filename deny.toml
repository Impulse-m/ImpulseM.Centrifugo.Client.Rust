# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Unmaintained crates and yanked versions fail too, not only vulnerabilities.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only (docs/spec.md §3.1, C-PERMISSIVE).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0", # webpki-roots
  "OpenSSL",             # aws-lc-rs / aws-lc-sys
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Keep OpenSSL out: TLS is rustls-only (docs/spec.md §3.2).
deny = [
  { crate = "openssl-sys", reason = "TLS is rustls-only" },
  { crate = "native-tls", reason = "TLS is rustls-only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
