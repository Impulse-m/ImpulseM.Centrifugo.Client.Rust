# Publishes a release when a maintainer pushes a `vX.Y.Z` tag (CONTRIBUTING.md,
# "Releases"). The version bump and the changelog come from the release PR
# (release-plz.yml); this workflow only publishes what that PR merged.
#
# 1. Checks the tag: it names the workspace version, points at a commit on
#    main, and that commit passed CI.
# 2. Publishes the core, then the client, to crates.io through trusted
#    publishing (OIDC, no token secret). A version already on crates.io is
#    skipped, so a rerun after a partial publish, or a tag pushed after a
#    manual first publish, completes the release.
# 3. Creates the GitHub release from the version's CHANGELOG.md section.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    if: github.repository_owner == 'centrifugal'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write  # the GitHub release
      checks: read     # the tagged commit's CI result
      id-token: write  # crates.io trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No build cache here: a poisoned cache must not reach a published crate.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Check the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version_of() {
            cargo metadata --no-deps --format-version 1 --locked \
              | jq -r --arg n "$1" '.packages[] | select(.name == $n) | .version'
          }
          version=$(version_of centrifuge-client)
          core=$(version_of centrifuge-client-core)
          if [ "$GITHUB_REF_NAME" != "v$version" ] || [ "$core" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but centrifuge-client is $version and centrifuge-client-core is $core"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main"
            exit 1
          fi
          ci=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=CI%20success" \
            --jq '[.check_runs[].conclusion] | first // "missing"')
          if [ "$ci" != "success" ]; then
            echo "::error::CI on $GITHUB_SHA: $ci (wait for CI to pass on main, then rerun)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Find what is not published yet
        id: todo
        run: |
          set -eu
          todo=""
          for crate in centrifuge-client-core centrifuge-client; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "centrifuge-rust-release (https://github.com/centrifugal/centrifuge-rust)" \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            case "$status" in
              200) echo "$crate $VERSION is already on crates.io" ;;
              404) todo="$todo $crate" ;;
              *) echo "::error::crates.io answered $status for $crate $VERSION"; exit 1 ;;
            esac
          done
          echo "crates=$todo" >> "$GITHUB_OUTPUT"

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.todo.outputs.crates != ''
        id: auth

      # In dependency order: the client pins the core exactly, so the core must
      # be in the index first (cargo publish waits for it).
      - name: Publish to crates.io
        if: steps.todo.outputs.crates != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATES: ${{ steps.todo.outputs.crates }}
        run: |
          set -eu
          for crate in $CRATES; do
            cargo publish --locked -p "$crate"
          done

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists"
            exit 0
          fi
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            /^## \[/ { on = 0 }
            on
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::no CHANGELOG.md section for $VERSION"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
