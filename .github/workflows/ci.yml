name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # Build and test on both desktop platforms the C ABI ships to. The toolchain
  # is pinned to rust-toolchain.toml; no secrets are needed.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
        env:
          RUSTFLAGS: -D warnings
      - run: cargo build -p impulse-centrifugo-ffi --release --locked
        env:
          RUSTFLAGS: -D warnings

  # The committed header must be the cbindgen output for src/lib.rs.
  header-drift:
    name: C header matches cbindgen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cbindgen@0.29.4
      - name: Generate the header
        run: cbindgen --config crates/impulse-centrifugo-ffi/cbindgen.toml --crate impulse-centrifugo-ffi --output "$RUNNER_TEMP/impulse_centrifugo.h"
      - name: Compare with the committed header
        shell: bash
        run: diff --strip-trailing-cr -u crates/impulse-centrifugo-ffi/include/impulse_centrifugo.h "$RUNNER_TEMP/impulse_centrifugo.h"

  # The header must compile with MSVC as C, warnings as errors.
  header-msvc:
    name: C header compiles with MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile a probe that includes the header
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          $header = (Resolve-Path 'crates/impulse-centrifugo-ffi/include/impulse_centrifugo.h').Path
          $probe = Join-Path $env:RUNNER_TEMP 'impulse_header_probe.c'
          $batch = Join-Path $env:RUNNER_TEMP 'impulse_header_probe.bat'
          Set-Content -Path $probe -Encoding ascii -Value @(
              "#include `"$header`"",
              'int impulse_header_probe(void) { return IMPULSE_CENTRIFUGO_ABI_VERSION; }'
          )
          Set-Content -Path $batch -Encoding ascii -Value @(
              '@echo off',
              "set `"PATH=${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer;%PATH%`"",
              "call `"$vcvars`" >nul",
              "cl /c /nologo /W4 /WX /Fo`"$env:RUNNER_TEMP\impulse_header_probe.obj`" `"$probe`""
          )
          cmd.exe /d /c $batch
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }
