version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Wait before taking a fresh release: most malicious or broken versions
    # are yanked within days.
    cooldown:
      default-days: 7
    # Lock-file-only bumps keep CI on current dependencies without widening
    # the published version requirements; minimal-versions CI guards those.
    versioning-strategy: lockfile-only
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
